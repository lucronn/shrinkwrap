[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shrinkwrap-cli"
version = "0.1.5"
description = "Local stdio MCP tool-result compaction with retrievable references"
readme = "README.md"
authors = [{ name = "ShrinkWrap Maintainers" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = ["tomlkit>=0.13,<1"]

[project.optional-dependencies]
benchmark = ["tiktoken>=0.7"]

[project.urls]
Repository = "https://github.com/lucronn/shrinkwrap"
Issues = "https://github.com/lucronn/shrinkwrap/issues"
Changelog = "https://github.com/lucronn/shrinkwrap/blob/main/CHANGELOG.md"

[project.scripts]
shrinkwrap = "shrinkwrap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shrinkwrap*"]
