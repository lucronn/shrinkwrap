[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shrinkwrap-mcp"
version = "0.1.0"
description = "Drop-in 90%+ Token Compaction Proxy for MCP & AI Agent Tools"
readme = "README.md"
authors = [{ name = "ShrinkWrap Maintainers" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
shrinkwrap = "shrinkwrap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shrinkwrap*"]
